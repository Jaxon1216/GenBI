# GenBI 本地开发依赖：MySQL / Redis / RabbitMQ
#
#   docker compose up -d            启动全部
#   docker compose up -d mysql      只启动 MySQL
#   docker compose ps               查看状态（需为 healthy）
#   docker compose down             停止并删除容器（保留数据）
#   docker compose down -v          连同数据卷一起删除（下次启动重新执行建表 SQL）
#
# 若本机已有 brew 的 redis/rabbitmq 在跑，先 brew services stop redis rabbitmq，否则 6379/5672 冲突。
name: genbi

services:
  mysql:
    image: mysql:8.0
    environment:
      # 密码需与 backend/.env 的 DB_DSN 保持一致
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123}
      MYSQL_DATABASE: genbi
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 仅在数据卷为空（首次启动）时按文件名顺序执行
      - ./backend/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # $$ 转义后才会在容器内展开变量
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # 管理台，guest/guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
